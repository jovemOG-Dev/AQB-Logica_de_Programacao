name: Deploy para o GitHub Pages

on:
  push:
    branches: ["main"]
  # Permite rodar manualmente pela aba "Actions" no GitHub também.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas execuções de deploy simultâneas.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (raiz do repositório)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
